# ---------------------------------------------------------------------------
# KNOWN ISSUES — read first. Neither blocks Task 0's own deliverables (discoal
# rebuild + contracts capture), but both are load-bearing for every later task.
# ---------------------------------------------------------------------------
known_issues:
  - id: demog_flags_not_growth
    severity: high
    summary: >
      demography.py::discoal_demog() returns ["-g", alpha, "-eg", T_scaled, "0.0"],
      but in THIS discoal fork (both the original discoal_oobfix build and the
      8ef7bc7 rebuild here) "-g" is the GENE-CONVERSION flag (conversionRate,
      tractLengthMean) and "-eg" is not a recognized flag at all — only
      -en/-ed/-ej/-ea exist under the "-e" family, and continuous growth is only
      reachable via "-D demesFile.yaml". Confirmed from source (identical arg-parse
      switch in master and 8ef7bc7) and from both binaries' own usage text.
    consequence: >
      The old (discoal_oobfix) binary's lenient/unvalidated parser silently
      absorbs the malformed sequence with no error: "-g" consumes alpha (89.1701)
      as my_gamma and consumes the literal token "-eg" as gcMean via atoi("-eg")==0;
      "0.028257" and "0.0" are then silently skipped (no switch case matches, no
      default handler). Net effect: 13_diploshic's completed training ran under
      CONSTANT population size N0 (never stepping to NREF), not the intended
      moments-fit exponential growth, plus a nonsensical my_gamma=89.1701/gcMean=0
      gene-conversion parameter that is empirically NOT inert (fixed-seed A/B test:
      omitting -g vs "-g 89.1701 0" gives different segsites/output; see report).
      The new, hardened 8ef7bc7 parser correctly REJECTS the same argv with exit 1
      ("Invalid integer argument for -g: '-eg'") instead of silently mis-parsing it
      — so this exact invocation cannot even be replayed against the rebuilt binary.
    action_needed: >
      Human/orchestrator decision required before Task 1+ writes simulation code
      that calls D.discoal_demog(): (a) accept that training was effectively
      constant-size and have Plan 02 simulate constant-size for train/sim
      consistency (drop -g/-eg from any discoal invocation — this is what the
      smoke test below does), or (b) fix demography.py to emit a valid growth
      spec (e.g. a demes YAML consumed via "-D") and retrain 13_diploshic first.
      Task 0 did NOT choose for you; harness.yaml below only records the resolved
      PATH to demography.py, not a flag string, so this decision is not baked in.
    verified_by: >
      task-0-report.md concern #1 (full source greps, usage-text diffs, and the
      fixed-seed cmp_A/cmp_B/cmp_C discoal runs are transcribed there).

  - id: msprime_tskit_not_installed_in_diploshic_env
    severity: medium
    summary: >
      `python -c "import msprime,tskit"` FAILS under
      /home/ssmall/miniforge3/envs/diploshic_env/bin/python (the env this harness
      otherwise uses throughout). diploshic_env's own site-packages contain only
      diploSHIC 1.1.0 + numpy 1.26.4 — msprime/tskit are not installed in-env.
      The bare `python -c ...` command instead silently picks up msprime 1.4.0 /
      tskit 1.0.1 leaking in from user site-packages
      (~/.local/lib/python3.10/site-packages, which sys.path search BEFORE the
      env's own site-packages for this interpreter). That tskit 1.0.1 build
      requires numpy>=2 (see its dist-info), but diploshic_env's active numpy is
      1.26.4, so import raises: "RuntimeError: module was compiled against NumPy
      C-API version 0x12 (NumPy 1.20) but the running NumPy has C-API version
      0x11" -> ImportError.
    consequence: >
      Global constraints call for msprime for the discoal->msprime selection
      convention (s_msprime = 2*s_discoal) and samples=350/ploidy=2 sampling.
      That code path is currently non-functional in diploshic_env, in either
      direction (using the leaked user-site version errors; `python -s` to
      exclude user-site just makes msprime disappear with ModuleNotFoundError
      instead, since it was never actually installed in the env).
    action_needed: >
      Human decision: install a numpy-1.26-compatible msprime/tskit properly
      INTO diploshic_env (risk: env is also the validated 13_diploshic
      TensorFlow/training env — do not casually bump numpy to >=2 to satisfy
      tskit 1.0.1, that risks breaking TF/diploSHIC compat instead), or point
      Plan 02's msprime-dependent code at a different, dedicated env. Not fixed
      as part of Task 0 (pip-installing into a shared validated env is outside
      this task's charter without explicit sign-off).
    verified_by: "task-0-report.md concern #2"

