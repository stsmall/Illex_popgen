# ---------------------------------------------------------------------------
# Constants — must match 13_diploshic training regime exactly (global-constraints.md)
# ---------------------------------------------------------------------------
constants:
  NHAP: 700              # haplotypes (350 diploids); discoal sampleSize arg. msprime: samples=350, ploidy=2 — never samples=700.
  MU: 3.0e-9              # per-bp mutation rate
  WIN: 44000              # diploSHIC training scan window (bp) — 13_diploshic WINLEN
  NSUB: 11                # sub-windows per scan window (--numSubWins)
  locus_len_default: 1000000   # Plan 02 new capability: full 1 Mb loci (13_diploshic never simulated beyond WIN=44000)
  MAXMUTS: 800000          # bumped from 400000 (as found at 8ef7bc7) / 40000 (master's discoal.h) for Mb-scale loci
  MAXSITES: 100000000      # unchanged, per task instructions

  # moments exponential-growth demography (13_diploshic/demography.py) — present-referenced
  N0: 6808096.0            # present-day Ne
  NREF: 547928.0           # ancestral Ne
  T_YEARS: 769519.0
  GEN: 1.0
  THETA_PER_BP: 2.7232384e-2   # = 4*N0*MU

  # sweep priors (13_diploshic/simulate.py) — reuse verbatim for Plan 02 sweeps
  sweep_alpha_2Ns: "2*N0 * 10**U(-4,-2)"     # alpha = 2Ns, discoal -a
  sweep_tau_4N0_units: "U(0, 0.05)"           # fixation time ago, discoal -ws
  soft_sweep_start_freq: "10**U(-3,-1)"       # discoal -f, applied to ~50% of sweep sims
  discoal_to_msprime_selection: "s_msprime = 2 * s_discoal"   # verified from msprime docstring

  # fvecVcf / predict invocation (must mirror 13_diploshic/fvec_one.sh verbatim; NO --totalPhysLen)
  fvecvcf_unmaskedFracCutoff: 0.25
  fvecvcf_unmaskedGenoFracCutoff: 0.75   # default, not passed explicitly in fvec_one.sh
  predict_numSubWins: 11

